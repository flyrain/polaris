name: Verify unreleased documentation
on:
  push:
    branches: ['yf/verify-doc-gaps-20261120']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Format and compile
        run: ./gradlew format compileAll
      - name: Verify the documented credential and commit behavior
        run: >
          ./gradlew :polaris-core:test --tests '*AwsCredentialsStorageIntegrationTest'
          :polaris-runtime-service:test --tests '*EntityIdempotencyCreateTableTest'
          --tests '*EntityIdempotencyUpdateTableTest' --tests '*GetConfigTest'
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apache/polaris
          ref: versioned-docs
          path: site/content/releases
          persist-credentials: false
      - name: Build the documentation site
        run: site/bin/create-static-site.sh
      - name: Verify the rendered links and examples
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('site/build/apache-site/in-dev/unreleased')
          docs = (root/'command-line-interface/index.html').read_text()
          assert 'id="export"' in docs and 'omits policy attachments' in docs
          restore = (root/'helm-chart/persistence/index.html').read_text()
          assert 'command-line-interface/#export' in restore and 'applicable' in restore
          assert 'Revoking table access' in (root/'vended-credentials/index.html').read_text()
          assert 'table-commit-retries/' in (root/'polaris-api-specs/index.html').read_text()
          assert 'UUIDv7' in (root/'polaris-api-specs/table-commit-retries/index.html').read_text()
          PYTHON
