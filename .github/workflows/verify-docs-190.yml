name: Verify documentation changes with Polaris 1.9.0
on:
  push:
    branches: ['yf/verify-docs-190-20261118']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Mount the release documentation and apply the five page changes
        run: |
          git fetch --quiet https://github.com/apache/polaris.git 4ca43463d32de0294f1d62249595c8def903fee8
          mkdir -p site/content/releases
          git archive FETCH_HEAD | tar -x -C site/content/releases
          git fetch --quiet https://github.com/flyrain/polaris.git ed7dcc28b5025ef75974bf2664cab2abaf146c15
          git show FETCH_HEAD:1.9.0/metastores/relational-jdbc.md > site/content/releases/1.9.0/metastores/relational-jdbc.md
          git fetch --quiet https://github.com/flyrain/polaris.git 97d03164771785685f6fb11ccf4bd6faf52f46fb
          git show FETCH_HEAD:1.9.0/getting-started/creating-a-catalog/_index.md > site/content/releases/1.9.0/getting-started/creating-a-catalog/_index.md
          git fetch --quiet https://github.com/flyrain/polaris.git b8039cdebf984a470577b00f0658409768450fa8
          git show FETCH_HEAD:1.9.0/polaris-api-specs/polaris-management-api.md > site/content/releases/1.9.0/polaris-api-specs/polaris-management-api.md
          git fetch --quiet https://github.com/flyrain/polaris.git 4753d6992c9caf19cad2f5376d1af12fa65a77c9
          git show FETCH_HEAD:1.9.0/policy.md > site/content/releases/1.9.0/policy.md
          git fetch --quiet https://github.com/flyrain/polaris.git 2c559b1e9a8bd94825caf7eea106056b67c612aa
          git show FETCH_HEAD:1.9.0/federation/hadoop-catalog-federation.md > site/content/releases/1.9.0/federation/hadoop-catalog-federation.md
      - name: Format and compile Polaris
        run: ./gradlew format compileAll
