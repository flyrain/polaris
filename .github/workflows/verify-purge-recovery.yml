name: Verify purge task recovery
on:
  push:
    branches: ['yf/verify-purge-recovery']
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REVISION: 1c696b927f2399a9c0f4f885e3ee2e19c08cbd09
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c696b927f2399a9c0f4f885e3ee2e19c08cbd09
          persist-credentials: false
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$REVISION" -f state=pending -f context="Purge recovery verification" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Checking formatting, compilation, and the runtime service"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-test-env
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
          validate-wrappers: false
      - name: Check plugin repositories
        run: |
          plugin_path=com/gradle/develocity/com.gradle.develocity.gradle.plugin/4.6.1/com.gradle.develocity.gradle.plugin-4.6.1.pom
          impl_path=com/gradle/develocity-gradle-plugin/4.6.1/develocity-gradle-plugin-4.6.1.pom
          for repo in https://repo.maven.apache.org/maven2 https://plugins.gradle.org/m2 https://maven-central.storage-download.googleapis.com/maven2; do
            for artifact in "$plugin_path" "$impl_path"; do
              curl -LsS --max-time 20 -o /dev/null -w '%{http_code} %{url_effective}\n' "$repo/$artifact" || true
            done
          done
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-mirror.gradle <<'EOF'
          beforeSettings { s ->
            s.pluginManagement.repositories.maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
          }
          EOF
      - name: Format and compile
        run: ./gradlew --refresh-dependencies --info format compileAll
      - name: Run runtime service checks
        run: ./gradlew :polaris-runtime-service:check
      - name: Check formatter output
        if: always()
        run: git diff --exit-code -- runtime/service/src
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            *) state=failure ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$REVISION" -f state="$state" -f context="Purge recovery verification" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Gradle format, compileAll, and runtime service checks"
